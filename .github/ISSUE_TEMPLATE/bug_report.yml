name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste real activity data (titles, URLs, on-screen text, commands). Use synthetic examples."
  - type: input
    id: version
    attributes:
      label: lifetrace version and macOS version
      placeholder: "lifetrace --version → 0.3.0; macOS 15.4"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: status
    attributes:
      label: "`lifetrace status --json` (remove anything private)"
      render: json
